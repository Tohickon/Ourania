# J7: build Ourania and run every check suite on a clean Windows machine, on every push.
#
# Why this exists: with several sessions working one tree, the suites are the only channel
# between them, and until now nothing ran them but a person. This runs build.ps1 -All, which
# fails on any red suite not listed in OuraniaWindows/known-red.txt.
#
# The Swiss Ephemeris files are not in the repository (see THIRD-PARTY-NOTICES.md). The five
# main ones are fetched from the Swiss Ephemeris project's own repository. The four numbered-
# asteroid files this machine has (Hygiea, Eros, Nessus, Eris) are only published through a
# Dropbox folder now, so CI runs without them.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
        working-directory: OuraniaWindows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the Swiss Ephemeris files
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ephe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($f in "sepl_18.se1", "semo_18.se1", "seas_18.se1", "sefstars.txt", "seasnam.txt") {
            Invoke-WebRequest "https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/$f" -OutFile (Join-Path $dir $f)
          }
          "OURANIA_EPHE=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build and run every suite
        # known-red-ci.txt: the suites red only here, for want of the four asteroid files.
        run: .\build.ps1 -Out out-ci -All -KnownRed known-red.txt,known-red-ci.txt

      - name: Keep the suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: OuraniaWindows/out-ci-logs
          retention-days: 14

  package:
    # J4: the app with its own Java runtime, so it runs on a machine with no Java installed.
    # jpackage is part of a full JDK, which Android Studio's bundled runtime leaves out -
    # so the package is built here rather than on David's machine.
    runs-on: windows-latest
    needs: check
    if: github.event_name != 'pull_request'
    defaults:
      run:
        shell: pwsh
        working-directory: OuraniaWindows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the Swiss Ephemeris files
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ephe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($f in "sepl_18.se1", "semo_18.se1", "seas_18.se1", "sefstars.txt", "seasnam.txt") {
            Invoke-WebRequest "https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/$f" -OutFile (Join-Path $dir $f)
          }
          "OURANIA_EPHE=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the app image
        run: .\build.ps1 -Out out-pkg -Package

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: Ourania-windows
          path: OuraniaWindows/dist/package
          retention-days: 14

      # J4: an actual installer, not a folder. jpackage builds an MSI through the WiX Toolset,
      # which the GitHub Windows image happens to ship and is under no obligation to keep -
      # so this step is allowed to fail without failing the build, and the folder form above
      # stays the artefact the release is made of. If it starts failing, read the log before
      # assuming the build broke: the likeliest cause is the image dropping WiX.
      #
      # NOT SIGNED. An unsigned MSI raises SmartScreen on any machine that did not build it,
      # and signing needs a certificate that has to be bought and kept secret. That is the last
      # thing standing between this row and closed, and it is not a code problem.
      - name: Build an installer
        continue-on-error: true
        run: .\build.ps1 -Out out-msi -Package -PackageType msi

      - name: Keep the installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Ourania-installer
          path: OuraniaWindows/dist/package/*.msi
          retention-days: 14

  android:
    # M2: the phone app, built from the same engine source as the desktop - OuraniaAndroid's
    # build reads the engine's file list out of EngineIsolationCheck and compiles those files in
    # place, and packs the desktop's data folder as its assets. An installable debug APK is kept.
    # Independent of the Windows jobs: a red suite there does not stop the phone building, and
    # the reverse.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OuraniaAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; this installs the platform the app compiles
      # against if the image has moved on from it.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      # The same five files the Windows jobs fetch; packed into the APK so the phone computes
      # with the Swiss Ephemeris rather than its built-in fallback, and used by the tests.
      - name: Fetch the Swiss Ephemeris files
        run: |
          dir="$RUNNER_TEMP/ephe"
          mkdir -p "$dir"
          for f in sepl_18.se1 semo_18.se1 seas_18.se1 sefstars.txt seasnam.txt; do
            curl -sSfL "https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/$f" -o "$dir/$f"
          done
          echo "OURANIA_EPHE=$dir" >> "$GITHUB_ENV"

      # M3: PhoneChartTest runs the phone's whole path - atlas search, cast, placements - on the
      # JVM, since there is no emulator here.
      - name: Build the APK and run the phone's tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests
          path: OuraniaAndroid/app/build/reports/tests
          retention-days: 14

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: Ourania-android
          path: OuraniaAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
